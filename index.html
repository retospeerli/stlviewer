<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STL Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 16px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      padding: 12px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .toolbar button,
    .toolbar label.file-button {
      border: none;
      background: #222;
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .toolbar button:hover,
    .toolbar label.file-button:hover {
      opacity: .88;
    }

    .toolbar input[type="file"] {
      display: none;
    }

    .toolbar input[type="color"] {
      width: 42px;
      height: 38px;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .viewer-wrap {
      position: relative;
      width: 100%;
      height: min(72vh, 700px);
      min-height: 420px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, #ffffff 0%, #e8e8e8 60%, #d9d9d9 100%);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,.12);
    }

    #viewer {
      width: 100%;
      height: 100%;
    }

    .info {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 8px 10px;
      background: rgba(255,255,255,.88);
      border-radius: 9px;
      font-size: 13px;
      pointer-events: none;
      backdrop-filter: blur(6px);
    }

    .drop-hint {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.52);
      color: white;
      font-size: 26px;
      font-weight: bold;
      z-index: 5;
      pointer-events: none;
    }

    .viewer-wrap.dragging .drop-hint {
      display: flex;
    }

    @media (max-width: 700px) {
      .viewer-wrap {
        height: 65vh;
        min-height: 350px;
      }

      .toolbar {
        gap: 8px;
      }

      .toolbar button,
      .toolbar label.file-button {
        padding: 9px 11px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="toolbar">
    <label class="file-button">
      STL öffnen
      <input id="fileInput" type="file" accept=".stl" />
    </label>

    <button id="resetBtn">Ansicht zurücksetzen</button>
    <button id="wireframeBtn">Drahtgitter: aus</button>
    <button id="fullscreenBtn">Vollbild</button>

    <label>
      Farbe
      <input id="colorPicker" type="color" value="#d4a017" />
    </label>
  </div>

  <div class="viewer-wrap" id="viewerWrap">
    <div id="viewer"></div>
    <div class="drop-hint">STL-Datei hier ablegen</div>
    <div class="info" id="info">Noch kein STL geladen</div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const viewer = document.getElementById("viewer");
const viewerWrap = document.getElementById("viewerWrap");
const fileInput = document.getElementById("fileInput");
const resetBtn = document.getElementById("resetBtn");
const wireframeBtn = document.getElementById("wireframeBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const colorPicker = document.getElementById("colorPicker");
const info = document.getElementById("info");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  45,
  viewer.clientWidth / viewer.clientHeight,
  0.1,
  100000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(viewer.clientWidth, viewer.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.screenSpacePanning = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.0));

const keyLight = new THREE.DirectionalLight(0xffffff, 3.0);
keyLight.position.set(3, 4, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 1.5);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

const grid = new THREE.GridHelper(200, 20, 0x999999, 0xcccccc);
grid.material.opacity = 0.25;
grid.material.transparent = true;
scene.add(grid);

const loader = new STLLoader();

let mesh = null;
let wireframe = false;

const material = new THREE.MeshStandardMaterial({
  color: colorPicker.value,
  roughness: 0.55,
  metalness: 0.08
});

function clearCurrentModel() {
  if (!mesh) return;

  scene.remove(mesh);

  if (mesh.geometry) {
    mesh.geometry.dispose();
  }

  mesh = null;
}

function fitCameraToObject(object) {
  const box = new THREE.Box3().setFromObject(object);

  const size = new THREE.Vector3();
  const center = new THREE.Vector3();

  box.getSize(size);
  box.getCenter(center);

  const maxDim = Math.max(size.x, size.y, size.z);

  const fov = THREE.MathUtils.degToRad(camera.fov);
  let cameraZ = Math.abs(maxDim / (2 * Math.tan(fov / 2)));
  cameraZ *= 1.65;

  camera.position.set(
    center.x + cameraZ * 0.65,
    center.y + cameraZ * 0.45,
    center.z + cameraZ
  );

  camera.near = Math.max(maxDim / 1000, 0.01);
  camera.far = Math.max(maxDim * 100, 1000);
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.minDistance = maxDim * 0.05;
  controls.maxDistance = maxDim * 20;
  controls.update();

  grid.scale.setScalar(Math.max(maxDim / 200, 0.01));
}

function loadGeometry(geometry, filename = "STL-Modell") {
  clearCurrentModel();

  geometry.computeVertexNormals();
  geometry.center();

  mesh = new THREE.Mesh(geometry, material);
  mesh.rotation.x = -Math.PI / 2;

  scene.add(mesh);

  fitCameraToObject(mesh);

  const position = geometry.attributes.position;
  const triangles = position ? Math.floor(position.count / 3) : 0;

  geometry.computeBoundingBox();
  const size = new THREE.Vector3();
  geometry.boundingBox.getSize(size);

  info.textContent =
    `${filename} · ${triangles.toLocaleString("de-CH")} Dreiecke · ` +
    `${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm`;
}

function loadSTLBuffer(buffer, filename) {
  try {
    const geometry = loader.parse(buffer);
    loadGeometry(geometry, filename);
  } catch (error) {
    console.error(error);
    info.textContent = "STL konnte nicht geladen werden.";
  }
}

function openFile(file) {
  if (!file) return;

  if (!file.name.toLowerCase().endsWith(".stl")) {
    info.textContent = "Bitte eine STL-Datei auswählen.";
    return;
  }

  const reader = new FileReader();

  reader.onload = event => {
    loadSTLBuffer(event.target.result, file.name);
  };

  reader.readAsArrayBuffer(file);
}

fileInput.addEventListener("change", event => {
  openFile(event.target.files[0]);
});

colorPicker.addEventListener("input", () => {
  material.color.set(colorPicker.value);
});

wireframeBtn.addEventListener("click", () => {
  wireframe = !wireframe;
  material.wireframe = wireframe;
  wireframeBtn.textContent =
    wireframe ? "Drahtgitter: ein" : "Drahtgitter: aus";
});

resetBtn.addEventListener("click", () => {
  if (mesh) fitCameraToObject(mesh);
});

fullscreenBtn.addEventListener("click", async () => {
  if (!document.fullscreenElement) {
    await viewerWrap.requestFullscreen();
  } else {
    await document.exitFullscreen();
  }
});

viewerWrap.addEventListener("dragover", event => {
  event.preventDefault();
  viewerWrap.classList.add("dragging");
});

viewerWrap.addEventListener("dragleave", () => {
  viewerWrap.classList.remove("dragging");
});

viewerWrap.addEventListener("drop", event => {
  event.preventDefault();
  viewerWrap.classList.remove("dragging");

  const file = event.dataTransfer.files[0];
  openFile(file);
});

function resize() {
  const width = viewer.clientWidth;
  const height = viewer.clientHeight;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

window.addEventListener("resize", resize);
document.addEventListener("fullscreenchange", () => {
  setTimeout(resize, 50);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

camera.position.set(100, 80, 120);
controls.target.set(0, 0, 0);
controls.update();

animate();

/*
-------------------------------------------------------
OPTIONAL: FESTE STL-DATEI AUTOMATISCH LADEN
-------------------------------------------------------

Wenn neben index.html z. B. eine Datei "modell.stl" liegt,
kannst du diese automatisch laden.

Dazu den folgenden Block aktivieren:

fetch("modell.stl")
  .then(response => response.arrayBuffer())
  .then(buffer => loadSTLBuffer(buffer, "modell.stl"));

*/
</script>

</body>
</html>
